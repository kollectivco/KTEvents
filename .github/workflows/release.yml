name: Create Release ZIP

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate Plugin Version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          HEADER_VERSION=$(grep -m 1 "Version:" kontentainment-events.php | awk '{print $NF}')
          CONSTANT_VERSION=$(grep "define( 'KE_PLUGIN_VERSION'" kontentainment-events.php | cut -d"'" -f4)
          
          echo "Tag Version: $TAG_VERSION"
          echo "Header Version: $HEADER_VERSION"
          echo "Constant Version: $CONSTANT_VERSION"
          
          if [ "$TAG_VERSION" != "$HEADER_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Plugin Header Version ($HEADER_VERSION)"
            exit 1
          fi
          
          if [ "$TAG_VERSION" != "$CONSTANT_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match KE_PLUGIN_VERSION ($CONSTANT_VERSION)"
            exit 1
          fi

      - name: Create release folder and ZIP
        run: |
          PLUGIN_SLUG="kontentainment-events"
          rm -rf $PLUGIN_SLUG $PLUGIN_SLUG.zip
          mkdir $PLUGIN_SLUG
          rsync -rc . $PLUGIN_SLUG/ --exclude=".git*" --exclude=".github" --exclude="$PLUGIN_SLUG" --exclude="*.zip" --exclude="node_modules"
          zip -r $PLUGIN_SLUG.zip $PLUGIN_SLUG/
          
      - name: Verify ZIP Content
        run: |
          unzip -l kontentainment-events.zip | grep -E "kontentainment-events/kontentainment-events.php"
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: kontentainment-events.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
