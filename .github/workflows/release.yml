name: Create Release ZIP

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create release folder and ZIP
        run: |
          # Define plugin slug
          PLUGIN_SLUG="kontentainment-events"
          
          # Clean up any potential artifacts
          rm -rf $PLUGIN_SLUG $PLUGIN_SLUG.zip
          
          # Create fresh folder
          mkdir $PLUGIN_SLUG
          
          # Sync files (excluding git, github, and the destination folder itself)
          rsync -rc . $PLUGIN_SLUG/ --exclude=".git*" --exclude=".github" --exclude="$PLUGIN_SLUG" --exclude="*.zip" --exclude="node_modules" --exclude="composer.json" --exclude="composer.lock" --exclude="RELEASE_GUIDE.md"
          
          # Create the ZIP
          zip -r $PLUGIN_SLUG.zip $PLUGIN_SLUG/
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: kontentainment-events.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
